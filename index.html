<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1a2b4c">
<!-- iPhone：ホーム画面から開いたときにアドレス欄を出さない -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="材料在庫">
<title>材料在庫</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- 材料在庫アプリの画面。データはここには無く、合言葉を入れた端末だけが Google Apps Script（データ係）から読み書きできる -->
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<style>
:root { --navy:#1a2b4c; --bg:#f2f4f8; --card:#fff; --text:#1a2233; --sub:#5b6577; --line:#d9dee8; --ok:#1e8e3e; --warn:#d35400; --ng:#c0392b; --accent:#2f6fde; }
* { box-sizing:border-box; }
body { margin:0; font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif; font-size:18px; color:var(--text); background:var(--bg); padding-bottom:84px; }
header { background:var(--navy); color:#fff; padding:10px 14px; padding-top:calc(10px + env(safe-area-inset-top)); display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:5; }
header h1 { font-size:20px; margin:0; flex:1; }
header select { font-size:15px; padding:4px; border-radius:6px; max-width:45%; }
main { padding:12px; max-width:760px; margin:0 auto; }
nav { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--line); display:flex; z-index:5; padding-bottom:env(safe-area-inset-bottom); }
.empty-big { background:var(--ng); color:#fff; border-radius:14px; padding:22px 14px; text-align:center; font-size:30px; font-weight:bold; margin:10px 0; }
.empty-big small { display:block; font-size:16px; font-weight:normal; margin-top:6px; }
.howto { background:#e8f0fe; border-radius:10px; padding:10px 14px; font-size:15px; line-height:1.7; margin:8px 0; }
nav button { flex:1; border:0; background:none; padding:8px 0 10px; font-size:13px; color:var(--sub); display:flex; flex-direction:column; align-items:center; gap:2px; }
nav button svg { width:26px; height:26px; }
nav button.on { color:var(--navy); font-weight:bold; }
.view { display:none; } .view.on { display:block; }
.btn { display:block; width:100%; border:0; border-radius:10px; padding:14px; font-size:19px; font-weight:bold; background:var(--navy); color:#fff; margin:8px 0; }
.btn.sub { background:#fff; color:var(--navy); border:2px solid var(--navy); }
.btn.ok { background:var(--ok); } .btn.warn { background:var(--warn); } .btn.ng { background:var(--ng); }
.btn:disabled { opacity:.5; }
.row2 { display:flex; gap:8px; } .row2 > * { flex:1; }
.card { background:var(--card); border-radius:12px; padding:14px; margin:10px 0; box-shadow:0 1px 3px rgba(0,0,0,.08); }
.item { background:var(--card); border-radius:10px; padding:10px 12px; margin:6px 0; border-left:6px solid var(--navy); display:flex; justify-content:space-between; align-items:center; gap:8px; }
.item .n { font-weight:bold; } .item .s { font-size:14px; color:var(--sub); }
.item .q { font-size:22px; font-weight:bold; white-space:nowrap; }
.item.done { border-left-color:var(--ok); opacity:.65; }
input, select { font-size:18px; padding:10px; border:1px solid var(--line); border-radius:8px; width:100%; background:#fff; }
label.f { display:block; font-size:14px; color:var(--sub); margin:10px 0 3px; }
.big { font-size:42px; font-weight:bold; } .unit { font-size:20px; margin-left:4px; }
.muted { color:var(--sub); font-size:14px; }
.chips { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0; }
.chips button { border:1px solid var(--navy); background:#fff; color:var(--navy); border-radius:20px; padding:8px 14px; font-size:17px; }
#cam { position:relative; background:#000; border-radius:12px; overflow:hidden; display:none; }
#cam video { width:100%; display:block; }
#cam .frame { position:absolute; inset:18% 18%; border:4px solid rgba(255,255,255,.85); border-radius:12px; }
.msg { padding:10px 12px; border-radius:8px; margin:8px 0; font-size:16px; }
.msg.ok { background:#e6f4ea; color:#145c2a; } .msg.ng { background:#fdecea; color:#8a1c12; } .msg.info { background:#e8f0fe; color:#1a3d8f; }
#sheet { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; z-index:20; align-items:flex-end; justify-content:center; }
#sheet.on { display:flex; }
#sheet .body { background:var(--bg); width:100%; max-width:760px; max-height:92vh; overflow:auto; border-radius:16px 16px 0 0; padding:14px; }
#sheet .close { float:right; border:0; background:none; font-size:16px; color:var(--sub); padding:6px; }
details { background:#fff; border-radius:10px; margin:8px 0; padding:4px 12px; }
details summary { padding:8px 0; font-weight:bold; }
.prog { height:14px; background:#dde3ee; border-radius:7px; overflow:hidden; margin:6px 0; }
.prog div { height:100%; background:var(--ok); }
#toast { position:fixed; left:50%; bottom:96px; transform:translateX(-50%); background:#222; color:#fff; padding:10px 18px; border-radius:20px; font-size:16px; display:none; z-index:30; }
.lbl-row { display:flex; align-items:center; gap:10px; }
.lbl-row input[type=checkbox] { width:26px; height:26px; flex:none; }
/* 印刷（A4・8面＝105×74.25mm） */
#print { display:none; }
@media print {
  @page { size:A4; margin:0; }
  body { background:#fff; padding:0; }
  header, nav, main, #sheet, #toast { display:none !important; }
  #print { display:block; }
  .page { width:210mm; height:297mm; display:grid; grid-template-columns:105mm 105mm; grid-template-rows:repeat(4, 74.25mm); page-break-after:always; }
  .lab { padding:5mm; display:flex; gap:4mm; align-items:center; overflow:hidden; }
  .lab .qr { width:44mm; height:44mm; flex:none; }
  .lab .qr svg { width:100%; height:100%; }
  .lab .t { flex:1; min-width:0; }
  .lab .nm { font-size:17pt; font-weight:bold; line-height:1.2; word-break:break-all; }
  .lab .kg { font-size:14pt; margin-top:2mm; }
  .lab .sm { font-size:9pt; color:#333; margin-top:1.5mm; }
}
</style>
</head>
<body>
<header>
  <h1>材料在庫 <small style="font-size:12px;font-weight:normal;opacity:.7">v7</small> <span id="mode" style="display:none;font-size:13px;background:#e8913a;color:#fff;border-radius:6px;padding:1px 8px;vertical-align:middle">テスト</span></h1>
  <select id="staff" onchange="saveStaff()"></select>
  <button onclick="askToken('')" aria-label="合言葉の設定" style="border:0;background:none;color:#fff;padding:4px"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M14 9l2 2"/></svg></button>
</header>

<main>
  <!-- 読み取り -->
  <section class="view on" id="v-scan">
    <div id="cam"><video id="video" playsinline muted></video><div class="frame"></div></div>
    <button class="btn" id="b-cam" onclick="startCam('open')">カメラでQRを読む</button>
    <button class="btn sub" onclick="camMode='open';document.getElementById('photo').click()">写真を撮って読む</button>
    <input type="file" id="photo" accept="image/*" capture="environment" style="display:none" onchange="readPhoto(this)">
    <div id="scan-msg"></div>
    <p class="muted">携帯のふつうのカメラでQRを読んでも、このアプリが開きます。</p>
  </section>

  <!-- 材料 -->
  <section class="view" id="v-mat">
    <div class="row2"><input id="q-mat" placeholder="材料名・IDで探す" oninput="drawMat()"><select id="p-mat" onchange="drawMat()"></select></div>
    <button class="btn sub" onclick="openReceive('mat')">入荷を登録する</button>
    <div class="muted" id="sum-mat"></div>
    <div id="list-mat"></div>
  </section>

  <!-- 副資材 -->
  <section class="view" id="v-sub">
    <div class="row2"><input id="q-sub" placeholder="資材名・取引先で探す" oninput="drawSub()"><select id="p-sub" onchange="drawSub()"></select></div>
    <button class="btn sub" onclick="openReceive('sub')">新しい資材を登録する</button>
    <div id="list-sub"></div>
  </section>

  <!-- 棚卸 -->
  <section class="view" id="v-tana"><div id="tana"></div></section>

  <!-- ラベル -->
  <section class="view" id="v-label">
    <div class="row2">
      <select id="l-kind" onchange="drawLabel()"><option value="mat">材料</option><option value="sub">副資材</option></select>
      <select id="l-filter" onchange="drawLabel()"><option value="new">未印刷だけ</option><option value="all">すべて</option></select>
    </div>
    <input id="q-label" placeholder="名前で絞り込む" oninput="drawLabel()" style="margin-top:8px">
    <div class="row2"><button class="btn sub" onclick="checkAll(true)">全部選ぶ</button><button class="btn sub" onclick="checkAll(false)">全部外す</button></div>
    <button class="btn" onclick="printLabels()">選んだラベルを印刷（A4・8面）</button>
    <div id="list-label"></div>
  </section>
</main>

<nav>
  <button class="on" data-v="scan" onclick="show('scan')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8V4h4M17 4h4v4M21 16v4h-4M7 20H3v-4"/><rect x="8" y="8" width="8" height="8"/></svg>読み取り</button>
  <button data-v="mat" onclick="show('mat')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7l8-4 8 4v10l-8 4-8-4z"/><path d="M4 7l8 4 8-4M12 11v10"/></svg>材料</button>
  <button data-v="sub" onclick="show('sub')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="13"/><path d="M3 7l3-4h12l3 4M10 12h4"/></svg>副資材</button>
  <button data-v="tana" onclick="show('tana')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12l2 2 4-4M9 17h6"/></svg>棚卸</button>
  <button data-v="label" onclick="show('label')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8"/><path d="M6 14h12v7H6z"/></svg>ラベル</button>
</nav>

<div id="sheet" onclick="if(event.target===this)closeSheet()"><div class="body" id="sheet-body"></div></div>
<div id="toast"></div>
<div id="print"></div>

<script>
// データ係（Google Apps Script のウェブアプリ）
const API_URL = 'https://script.google.com/macros/s/AKfycbyBnvUjD2chjfheOnqi1PodNZxAXWn_pUZ0e_UPPh7jw4t39sx_NSeN9md8F__GIU5IRg/exec';
const START_ID = new URLSearchParams(location.search).get('id') || '';   // QR（このページのURL?id=…）から開いたとき
let D = null;            // サーバーから読んだデータ
let camMode = 'open';    // open：詳細を開く／tana：棚卸で読む
let stream = null, scanning = false, detector = null;

/* ---------- サーバー呼び出し ---------- */
// call('api_load') → データ係の load を呼ぶ。合言葉はこの端末にだけ保存してある
function call(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  const body = JSON.stringify({ token: store('zaiko_token') || '', fn: fn.replace(/^api_/, ''), args: args });
  // Content-Type を付けない（text/plain）ことで、事前確認なしで Google に送れる
  return fetch(API_URL, { method: 'POST', body: body }).then(function (r) { return r.json(); }).then(function (res) {
    if (res.ok) return res.result;
    if (res.auth) { askToken('合言葉が違うか、作り直されています。もう一度入れてください。'); }
    else toast('エラー：' + res.error);
    throw new Error(res.error);
  }, function (e) {
    toast('通信できませんでした。電波を確認してもう一度押してください');
    throw e;
  });
}

/** 合言葉を入れる画面 */
function askToken(note) {
  openSheet('<h2>合言葉の設定</h2><p>この端末で材料在庫アプリを使うための合言葉を入れてください（最初の1回だけ）。合言葉は管理者に聞いてください。</p>'
    + (note ? '<div class="msg ng">' + esc(note) + '</div>' : '')
    + '<input id="tok" type="password" autocomplete="off" placeholder="合言葉">'
    + '<button class="btn" onclick="saveToken()">登録する</button>');
}
function saveToken() {
  const t = $('tok').value.trim();
  if (!t) { toast('合言葉を入れてください'); return; }
  store('zaiko_token', t);
  closeSheet();
  start();
}
function start() {
  if (!store('zaiko_token')) { askToken(''); return; }
  // 前回読んだデータがあれば先に出す（Googleからの読み込みは数秒かかるため）。新しいデータが届いたら描き直す
  let cached = null;
  try { cached = JSON.parse(store('zaiko_cache') || 'null'); } catch (e) { cached = null; }
  if (cached) { render(cached); if (START_ID) openItem(START_ID); }
  load().then(function () { if (START_ID && !cached) openItem(START_ID); }).catch(function () {});
}
function load() {
  return call('api_load').then(function (d) {
    render(d);
    try { store('zaiko_cache', JSON.stringify(d)); } catch (e) {}
  });
}
function render(d) {
  D = d;
  $('mode').style.display = d.mode === 'test' ? 'inline-block' : 'none';   // テスト用コピーを見ているときだけ「テスト」と出す
  fillStaff(); fillPlaces();
  drawMat(); drawSub(); drawTana(); drawLabel();
}

/* ---------- 共通 ---------- */
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }
function num(n) { return Number(n || 0).toLocaleString('ja-JP'); }
function toast(s) { const t = $('toast'); t.textContent = s; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(function () { t.style.display = 'none'; }, 2200); }
function show(v) {
  document.querySelectorAll('.view').forEach(function (e) { e.classList.toggle('on', e.id === 'v-' + v); });
  document.querySelectorAll('nav button').forEach(function (b) { b.classList.toggle('on', b.dataset.v === v); });
  if (v !== 'scan' && v !== 'tana') stopCam();
  window.scrollTo(0, 0);
}
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
function staff() { return $('staff').value || ''; }
function saveStaff() { store('staff', staff()); }
function fillStaff() {
  const s = $('staff'), cur = s.value || store('staff') || '';
  const list = D.settings.staff.length ? D.settings.staff : [];
  s.innerHTML = '<option value="">担当者を選ぶ</option>' + list.map(function (n) { return '<option' + (n === cur ? ' selected' : '') + '>' + esc(n) + '</option>'; }).join('');
}
function fillPlaces() {
  const opt = function (list) { return '<option value="">すべての場所</option>' + list.map(function (p) { return '<option>' + esc(p) + '</option>'; }).join(''); };
  const pm = $('p-mat').value, ps = $('p-sub').value;
  $('p-mat').innerHTML = opt(uniq(D.materials.map(function (m) { return m.place; })));
  $('p-sub').innerHTML = opt(uniq(D.subs.map(function (m) { return m.place; })));
  $('p-mat').value = pm; $('p-sub').value = ps;
}
function uniq(a) { return a.filter(function (x, i) { return x && a.indexOf(x) === i; }).sort(); }
function find(id) {
  id = String(id || '').trim();
  const m = D.materials.filter(function (x) { return x.id === id; })[0];
  if (m) return { kind: 'mat', it: m };
  const s = D.subs.filter(function (x) { return x.id === id; })[0];
  if (s) return { kind: 'sub', it: s };
  return null;
}
function qrUrl(id) { return D.url + '?id=' + encodeURIComponent(id); }
/** QRの中身（URL or ID）から管理用IDを取り出す */
function idFrom(text) {
  const m = String(text).match(/[?&]id=([^&#\s]+)/);
  return decodeURIComponent(m ? m[1] : String(text).trim());
}
function placeText(it) { return esc(it.place) + (it.col ? ' ' + esc(it.col) : ''); }

/* ---------- 一覧 ---------- */
function drawMat() {
  const q = $('q-mat').value.trim().toLowerCase(), p = $('p-mat').value;
  const list = D.materials.filter(function (m) { return (!p || m.place === p) && (!q || (m.name + ' ' + m.id).toLowerCase().indexOf(q) >= 0); })
    .sort(function (a, b) { return a.name.localeCompare(b.name, 'ja') || b.kg - a.kg; });
  const total = list.reduce(function (s, m) { return s + m.kg; }, 0);
  $('sum-mat').textContent = list.length + 'パレット　合計 ' + num(total) + ' kg';
  $('list-mat').innerHTML = list.map(function (m) {
    return '<div class="item" onclick="openItem(\'' + m.id + '\')"><div><div class="n">' + esc(m.name) + '</div><div class="s">' + placeText(m) + (m.note ? '　' + esc(m.note) : '') + '</div></div><div class="q">' + num(m.kg) + '<span class="unit">kg</span></div></div>';
  }).join('') || '<p class="muted">該当なし</p>';
}
function drawSub() {
  const q = $('q-sub').value.trim().toLowerCase(), p = $('p-sub').value;
  const list = D.subs.filter(function (m) { return (!p || m.place === p) && (!q || (m.name + ' ' + m.cust + ' ' + m.id).toLowerCase().indexOf(q) >= 0); })
    .sort(function (a, b) { return a.cust.localeCompare(b.cust, 'ja') || a.name.localeCompare(b.name, 'ja'); });
  $('list-sub').innerHTML = list.map(function (m) {
    return '<div class="item" onclick="openItem(\'' + m.id + '\')"><div><div class="n">' + esc(m.name) + '</div><div class="s">' + esc(m.cust) + '　' + esc(m.place) + '</div></div><div class="q">' + num(m.qty) + '</div></div>';
  }).join('') || '<p class="muted">該当なし</p>';
}

/* ---------- 詳細（使う・移動・数量修正） ---------- */
function openSheet(html) { $('sheet-body').innerHTML = '<button class="close" onclick="closeSheet()">閉じる</button>' + html; $('sheet').classList.add('on'); }
function closeSheet() { $('sheet').classList.remove('on'); }

function openItem(id) {
  const f = find(id);
  if (!f) { openEmpty(id); return; }
  const it = f.it, mat = f.kind === 'mat', u = mat ? 'kg' : '';
  const qty = mat ? it.kg : it.qty;
  let places = mat ? D.settings.places : D.settings.subPlaces;
  if (it.place && places.indexOf(it.place) < 0) places = [it.place].concat(places);  // 一覧に無い書き方の場所も選べるように
  const chips = mat ? [25, 50, 100, 250, 500] : [10, 50, 100, 500];
  // 並び：数量を直す → 置き場を移す → 使う
  let h = '<div class="muted">' + (mat ? '材料' : '副資材　' + esc(it.cust)) + '　ID ' + esc(it.id) + '</div>'
    + '<h2 style="margin:4px 0">' + esc(it.name) + '</h2>'
    + (qty <= 0 ? '<div class="empty-big">在庫がありません<small>帳簿の数量が0です</small></div>'
      : '<div><span class="big">' + num(qty) + '</span><span class="unit">' + (mat ? 'kg' : '個・枚') + '</span></div>')
    + '<div class="muted">' + placeText(it) + (it.note ? '　' + esc(it.note) : '') + '　更新 ' + esc(it.date) + '</div>'
    + '<div class="card"><b>数量を直す</b><input id="fix" type="number" inputmode="decimal" value="' + qty + '"><button class="btn sub" onclick="doChange(\'' + f.kind + '\',\'' + it.id + '\',\'set\')">この数量に直す</button></div>'
    + '<div class="card"><b>置き場を移す</b><label class="f">保管場所</label><select id="mv-place">' + places.map(function (p) { return '<option' + (p === it.place ? ' selected' : '') + '>' + esc(p) + '</option>'; }).join('') + '</select>'
    + (mat ? '<label class="f">保管列（例：5-2）</label><input id="mv-col" value="' + esc(it.col) + '">' : '')
    + '<button class="btn sub" onclick="doChange(\'' + f.kind + '\',\'' + it.id + '\',\'move\')">移す</button></div>'
    + '<div class="card"><b>使う（在庫から引く）</b>'
    + '<div class="chips">' + chips.map(function (c) { return '<button onclick="$(\'amt\').value=' + c + '">' + c + u + '</button>'; }).join('') + '</div>'
    + '<input id="amt" type="number" inputmode="decimal" placeholder="数量' + (u ? '（kg）' : '') + '">'
    + '<button class="btn warn" onclick="doChange(\'' + f.kind + '\',\'' + it.id + '\',\'use\')">引く</button>'
    + (mat ? '<button class="btn ng" onclick="if(confirm(\'このパレットを使い切りにしますか？\'))doChange(\'mat\',\'' + it.id + '\',\'set\',0)">全部使った（使い切り）</button>' : '<button class="btn ok" onclick="doChange(\'sub\',\'' + it.id + '\',\'add\')">入荷（足す）</button>')
    + '</div>';
  openSheet(h);
}

/** 在庫に無いQR（使い切り済みなど）を大きく知らせる */
function openEmpty(id) {
  const e = (D.empty || {})[id];
  openSheet('<div class="empty-big">在庫がありません'
    + '<small>' + (e ? esc(e.name) + '<br>' + esc(e.date) + ' に使い切り' + (e.staff ? '（' + esc(e.staff) + '）' : '') : 'このQRの材料は登録されていません') + '</small></div>'
    + '<p class="muted">ID ' + esc(id) + '　このラベルははがしてください。</p>'
    + '<button class="btn sub" onclick="closeSheet()">閉じる</button>');
}

function doChange(kind, id, op, val) {
  if (!staff()) { toast('先に右上で担当者を選んでください'); return; }
  let amount = 0, place = '', col = '';
  if (op === 'use' || op === 'add') { amount = Number($('amt').value); if (!(amount > 0)) { toast('数量を入れてください'); return; } }
  if (op === 'set') { amount = val !== undefined ? val : Number($('fix').value); if (isNaN(amount) || amount < 0) { toast('数量が正しくありません'); return; } }
  if (op === 'move') { place = $('mv-place').value; col = $('mv-col') ? $('mv-col').value.trim() : ''; }
  document.querySelectorAll('#sheet-body .btn').forEach(function (b) { b.disabled = true; });
  call('api_change', kind, id, op, amount, place, col, staff(), '').then(function (r) {
    closeSheet();
    toast(r.removed ? '使い切りにしました' : '登録しました（残り ' + num(r.after) + (kind === 'mat' ? ' kg' : '') + '）');
    return load();
  }).catch(function () { document.querySelectorAll('#sheet-body .btn').forEach(function (b) { b.disabled = false; }); });
}

/* ---------- 入荷 ---------- */
function openReceive(kind) {
  const mat = kind === 'mat';
  // 候補：今の在庫の名前＋名前一覧（使い切りで行が消えた材料の名前も選べる）
  const nm = D.names || { mat: [], sub: [] };
  const names = uniq((mat ? D.materials : D.subs).map(function (m) { return m.name; }).concat(mat ? nm.mat : nm.sub.map(function (s) { return s.name; })));
  const places = mat ? D.settings.places : D.settings.subPlaces;
  openSheet('<h2>' + (mat ? '材料の入荷' : '副資材の登録') + '</h2>'
    + '<label class="f">' + (mat ? '材料名' : '資材名') + '（候補から選ぶか、新しく入力）</label><input id="r-name" list="r-names"' + (mat ? '' : ' onchange="fillCust()"') + '><datalist id="r-names">' + names.map(function (n) { return '<option value="' + esc(n) + '">'; }).join('') + '</datalist>'
    + (mat ? '' : '<label class="f">取引先</label><input id="r-extra" list="r-custs"><datalist id="r-custs">' + uniq(D.subs.map(function (m) { return m.cust; })).map(function (n) { return '<option value="' + esc(n) + '">'; }).join('') + '</datalist>')
    + '<label class="f">' + (mat ? '重さ（kg）' : '数量') + '</label><input id="r-amt" type="number" inputmode="decimal" value="' + (mat ? 500 : '') + '">'
    + '<label class="f">保管場所</label><select id="r-place">' + places.map(function (p) { return '<option>' + esc(p) + '</option>'; }).join('') + '</select>'
    + (mat ? '<label class="f">保管列（なくても可）</label><input id="r-col"><label class="f">補足（なくても可）</label><input id="r-extra">' : '')
    + '<button class="btn" onclick="doReceive(\'' + kind + '\')">登録する</button>');
}
/** 副資材：名前を選んだら取引先を自動で入れる */
function fillCust() {
  const n = $('r-name').value.trim();
  const hit = D.subs.filter(function (s) { return s.name === n; })[0] || ((D.names || {}).sub || []).filter(function (s) { return s.name === n; })[0];
  if (hit && hit.cust && !$('r-extra').value) $('r-extra').value = hit.cust;
}
function doReceive(kind) {
  if (!staff()) { toast('先に右上で担当者を選んでください'); return; }
  const name = $('r-name').value.trim(), amt = Number($('r-amt').value);
  if (!name || !(amt > 0)) { toast('名前と数量を入れてください'); return; }
  const col = $('r-col') ? $('r-col').value.trim() : '', extra = $('r-extra') ? $('r-extra').value.trim() : '';
  call('api_receive', kind, name, amt, $('r-place').value, col, extra, staff()).then(function (id) {
    return load().then(function () {
      openSheet('<h2>登録しました</h2><p>' + esc(name) + '　' + num(amt) + (kind === 'mat' ? ' kg' : '') + '<br><span class="muted">ID ' + esc(id) + '</span></p>'
        + '<button class="btn" onclick="closeSheet();$(\'l-kind\').value=\'' + kind + '\';$(\'l-filter\').value=\'new\';show(\'label\');drawLabel()">ラベルを印刷する</button>'
        + '<button class="btn sub" onclick="closeSheet()">あとで</button>');
    });
  });
}

/* ---------- カメラ ---------- */
function msg(el, cls, html) { $(el).innerHTML = html ? '<div class="msg ' + cls + '">' + html + '</div>' : ''; }

function startCam(mode) {
  camMode = mode;
  const box = mode === 'tana' ? $('tana-cam') : $('cam');
  const video = mode === 'tana' ? $('tana-video') : $('video');
  // すでに同じ画面でカメラが動いていれば、そのまま読み取りを再開（iPhoneはカメラを開き直すと数秒止まるため）
  if (stream && video.srcObject === stream) {
    box.style.display = 'block'; video.play().catch(function () {});
    if (!scanning) { scanning = true; loop(video); }
    return;
  }
  if (stream) stopCam();   // 別の画面で動いていたカメラは止めてから開く（二重に開くと固まる）
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { camFail(); return; }
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false }).then(function (s) {
    stream = s; video.srcObject = s; box.style.display = 'block';
    return video.play();
  }).then(function () {
    if ('BarcodeDetector' in window) { try { detector = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) { detector = null; } }
    scanning = true; loop(video);
    if ($('b-cam')) $('b-cam').style.display = mode === 'open' ? 'none' : '';
  }).catch(function () { camFail(); });
}
function camFail() {
  stopCam();
  const t = 'この画面ではカメラを直接使えませんでした。「写真を撮って読む」を使ってください。';
  if (camMode === 'tana') msg('tana-msg', 'ng', t); else msg('scan-msg', 'ng', t);
}
function stopCam() {
  scanning = false;
  if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
  ['cam', 'tana-cam'].forEach(function (i) { if ($(i)) $(i).style.display = 'none'; });
  if ($('b-cam')) $('b-cam').style.display = '';
}
const canvas = document.createElement('canvas');
function loop(video) {
  if (!scanning) return;
  const next = function () { setTimeout(function () { loop(video); }, 120); };
  if (!video.videoWidth) { next(); return; }
  if (detector) {
    detector.detect(video).then(function (r) { if (r.length) hit(r[0].rawValue); else next(); }).catch(function () { detector = null; next(); });
    return;
  }
  // iPhone（BarcodeDetector なし）：画面中央の枠のあたりだけを小さくして読む（全体を読むより何倍も速い）
  const vw = video.videoWidth, vh = video.videoHeight, side = Math.round(Math.min(vw, vh) * 0.8);
  const sx = Math.round((vw - side) / 2), sy = Math.round((vh - side) / 2), n = Math.min(480, side);
  canvas.width = n; canvas.height = n;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(video, sx, sy, side, side, 0, 0, n, n);
  const code = jsQR(ctx.getImageData(0, 0, n, n).data, n, n, { inversionAttempts: 'dontInvert' });
  if (code && code.data) hit(code.data); else next();
  function hit(text) {
    // 「在庫がありません」と出したばかりの同じQRは、3秒間は読み直さない（同じ表示を繰り返して重くならないように）
    if (ignore.id && ignore.id === idFrom(text) && Date.now() < ignore.until) { next(); return; }
    found(text);
  }
}
let ignore = { id: '', until: 0 };
function readPhoto(input) {
  const f = input.files && input.files[0]; input.value = '';
  if (!f) return;
  const img = new Image();
  img.onload = function () {
    const w = Math.min(1200, img.width), h = Math.round(img.height * w / img.width);
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, w, h);
    const code = jsQR(ctx.getImageData(0, 0, w, h).data, w, h);
    URL.revokeObjectURL(img.src);
    if (code && code.data) found(code.data, true);
    else msg(camMode === 'tana' && $('tana-msg') ? 'tana-msg' : 'scan-msg', 'ng', 'QRが読めませんでした。QRを大きく、ピントを合わせて撮ってください。');
  };
  img.src = URL.createObjectURL(f);
}
function found(text, fromPhoto) {
  if (navigator.vibrate) navigator.vibrate(80);
  const id = idFrom(text);
  if (camMode === 'tana' && D.tana.no) { scanning = false; tanaRead(id); return; }
  stopCam(); msg('scan-msg', '', '');
  openItem(id);
}

/* ---------- 棚卸 ---------- */
function tanaKey(kind, id) { return (kind === 'sub' ? '副資材' : '材料') + '|' + id; }
function drawTana() {
  const t = D.tana;
  const howto = '<div class="howto"><b>棚卸のやり方</b>（材料だけ。副資材は対象外）<br>'
    + '1. 「棚卸を始める」を押す<br>'
    + '2. <b>QRがあるもの</b>：「カメラで続けて読む」でQRにかざす → 数を見て「このまま」か「直して登録」→ 自動で次のカメラに戻る<br>'
    + '3. <b>QRが無い・読めないもの</b>：下の「QRなしで確認」で名前を入れて探し、押して同じように登録<br>'
    + '4. 全部終わったら「棚卸を終える」。確認していないものは「まだ確認していない」に残る</div>';
  if (!t.no) {
    $('tana').innerHTML = '<div class="card"><h2 style="margin-top:0">棚卸</h2>' + howto
      + '<button class="btn" onclick="tanaStart()">棚卸を始める</button></div>';
    return;
  }
  const all = tanaAll();
  const done = all.filter(function (x) { return t.done[tanaKey(x.kind, x.it.id)]; });
  const rest = all.length - done.length;
  const pct = all.length ? Math.round(done.length * 100 / all.length) : 0;
  // 確認カードはカメラより上に出す（読んだあとスクロールせずに押せるように）
  $('tana').innerHTML = '<div class="card" id="tana-top"><div class="muted">棚卸番号 ' + esc(t.no) + '</div>'
    + '<div><b>' + done.length + '</b> / ' + all.length + ' 件 確認済み（' + pct + '%）</div><div class="prog"><div style="width:' + pct + '%"></div></div>'
    + '<div id="tana-msg"></div><div id="tana-card"></div>'
    + '<div id="tana-cam-ph"></div>'
    + '<button class="btn" onclick="startCam(\'tana\')">カメラで続けて読む</button>'
    + '<button class="btn sub" onclick="camMode=\'tana\';document.getElementById(\'photo\').click()">写真を撮って読む</button></div>'
    + '<h3>QRなしで確認</h3><input id="tana-find" placeholder="材料名で探す" oninput="drawTanaList()">'
    + '<div id="tana-list"></div>'
    + '<details><summary>確認済み（' + done.length + '）</summary>' + done.map(function (x) {
      const r = t.done[tanaKey(x.kind, x.it.id)];
      return '<div class="item done" onclick="tanaRead(\'' + x.it.id + '\')"><div><div class="n">' + esc(x.it.name) + '</div><div class="s">' + esc(r.at) + '　' + esc(r.staff) + '</div></div><div class="q">' + num(r.qty) + '</div></div>';
    }).join('') + '</details>'
    + '<details><summary>棚卸のやり方</summary>' + howto + '</details>'
    + '<button class="btn ng" style="margin-top:24px" onclick="tanaEnd(' + rest + ')">棚卸を終える</button>';
  drawTanaList();
  // カメラの枠は描き直しても作り直さない（動いているカメラをそのまま差し込む）
  $('tana-cam-ph').replaceWith(tanaCamBox());
  if (stream && $('tana-video').srcObject === stream) $('tana-video').play().catch(function () {});
}
let tanaCamEl = null;
function tanaCamBox() {
  if (!tanaCamEl) {
    tanaCamEl = document.createElement('div');
    tanaCamEl.id = 'tana-cam';
    tanaCamEl.style.cssText = 'position:relative;background:#000;border-radius:12px;overflow:hidden;display:none';
    tanaCamEl.innerHTML = '<video id="tana-video" playsinline muted style="width:100%;display:block"></video><div class="frame" style="position:absolute;inset:18%;border:4px solid rgba(255,255,255,.85);border-radius:12px"></div>';
  }
  return tanaCamEl;
}
// 棚卸は材料だけ（副資材は対象外）
function tanaAll() {
  return D.materials.filter(function (m) { return m.kg > 0; }).map(function (m) { return { kind: 'mat', it: m }; });
}
/** まだ確認していないもの（名前で絞り込み。絞り込み中は場所でまとめずに全部出す） */
function drawTanaList() {
  if (!$('tana-list')) return;
  const q = ($('tana-find').value || '').trim().toLowerCase();
  const rest = tanaAll().filter(function (x) { return !D.tana.done[tanaKey(x.kind, x.it.id)]; });
  const row = function (x) {
    return '<div class="item" onclick="tanaRead(\'' + x.it.id + '\')"><div><div class="n">' + esc(x.it.name) + '</div><div class="s">' + (x.kind === 'sub' ? '副資材　' : '') + placeText(x.it) + '</div></div><div class="q">' + num(x.kind === 'mat' ? x.it.kg : x.it.qty) + '</div></div>';
  };
  if (q) {
    const hit = rest.filter(function (x) { return (x.it.name + ' ' + x.it.id).toLowerCase().indexOf(q) >= 0; });
    $('tana-list').innerHTML = '<p class="muted">まだ確認していないもの ' + hit.length + '件</p>' + (hit.map(row).join('') || '<p class="muted">該当なし（確認済みの中にあるかもしれません）</p>');
    return;
  }
  const byPlace = {};
  rest.forEach(function (x) { const p = x.it.place || '（場所なし）'; (byPlace[p] = byPlace[p] || []).push(x); });
  $('tana-list').innerHTML = '<p class="muted">まだ確認していない（' + rest.length + '件）：場所を押すと開きます</p>'
    + Object.keys(byPlace).sort().map(function (p) {
      return '<details><summary>' + esc(p) + '（' + byPlace[p].length + '）</summary>' + byPlace[p].map(row).join('') + '</details>';
    }).join('');
}
// iPhoneは指で弾いたスクロールの途中だと1回では止まらないことがあるので、少し間をおいて繰り返す
function tanaTop() {
  const go = function () { window.scrollTo(0, 0); if (document.scrollingElement) document.scrollingElement.scrollTop = 0; };
  go(); setTimeout(go, 120); setTimeout(go, 450);
}
function tanaStart() {
  if (!confirm('棚卸を始めますか？')) return;
  call('api_tanaStart').then(load);
}
function tanaEnd(rest) {
  if (!confirm((rest ? 'まだ読んでいないものが ' + rest + ' 件あります。\n' : '') + '棚卸を終えますか？')) return;
  stopCam(); call('api_tanaEnd').then(load);
}
/** 読んだ1件：帳簿の数を見せて「このまま」か「直す」 */
function tanaRead(id) {
  const f = find(id);
  if (!f || f.kind === 'sub') {
    const e = (D.empty || {})[id];
    $('tana-msg').innerHTML = f ? '<div class="msg info">副資材は棚卸の対象外です（' + esc(f.it.name) + '）</div>'
      : '<div class="empty-big">在庫がありません<small>' + (e ? esc(e.name) + '　' + esc(e.date) + ' に使い切り' : 'このQRの材料は登録されていません') + '<br>ラベルをはがしてください</small></div>';
    ignore = { id: id, until: Date.now() + 3000 };
    tanaTop(); resume(); return;
  }
  const it = f.it, mat = f.kind === 'mat', q = mat ? it.kg : it.qty;
  const again = D.tana.done[tanaKey(f.kind, it.id)];
  msg('tana-msg', '', '');
  if ($('tana-cam')) $('tana-cam').style.display = 'none';   // 確認中はカメラを隠す（カードがカメラの位置に来る）
  $('tana-card').innerHTML = '<div class="card" style="border:3px solid var(--accent)">'
    + (again ? '<div class="msg info">読み取り済みです（' + esc(again.at) + '）。もう一度登録できます。</div>' : '')
    + '<div class="n" style="font-size:20px;font-weight:bold">' + esc(it.name) + '</div><div class="muted">' + placeText(it) + '　ID ' + esc(it.id) + '</div>'
    + '<div>帳簿：<span class="big" style="font-size:32px">' + num(q) + '</span><span class="unit">' + (mat ? 'kg' : '') + '</span></div>'
    + '<button class="btn ok" onclick="tanaSave(\'' + f.kind + '\',\'' + it.id + '\',null)">このまま（帳簿どおり）</button>'
    + '<div class="row2"><input id="tana-q" type="number" inputmode="decimal" placeholder="実際の数"><button class="btn warn" style="margin:0" onclick="tanaSave(\'' + f.kind + '\',\'' + it.id + '\',$(\'tana-q\').value)">直して登録</button></div>'
    + '<button class="btn sub" onclick="$(\'tana-card\').innerHTML=\'\';resume()">やめる</button></div>';
  tanaTop();
}
function tanaSave(kind, id, qty) {
  if (!staff()) { toast('先に右上で担当者を選んでください'); return; }
  if (qty !== null && (qty === '' || isNaN(Number(qty)))) { toast('実際の数を入れてください'); return; }
  // Googleへの記録（1〜3秒かかる）は待たずに次の読み取りへ進む。記録できなかったときだけ知らせる
  const f = find(id);
  const book = f ? (kind === 'mat' ? f.it.kg : f.it.qty) : 0;
  const q = qty === null ? book : Number(qty);
  D.tana.done[tanaKey(kind, id)] = { qty: q, at: '今', staff: staff() };
  if (f) { if (kind === 'mat') f.it.kg = q; else f.it.qty = q; }
  const live = !!stream && camMode === 'tana';
  ignore = { id: id, until: Date.now() + 3000 };   // カメラがまだ同じパレットを向いているので、3秒間は読み直さない
  toast(q === book ? '記録しました' : '記録して在庫を直しました');
  drawTana();
  tanaTop();
  if (live) resume();
  call('api_tanaScan', kind, id, qty === null ? null : Number(qty), staff()).then(function (r) {
    if (r.qty === 0 && kind === 'mat') load();
  }).catch(function () {
    delete D.tana.done[tanaKey(kind, id)];
    drawTana();
    if (live) resume();
    msg('tana-msg', 'ng', '「' + esc(f ? f.it.name : id) + '」を記録できませんでした。もう一度読んでください。');
  });
}
function resume() {
  if (stream && camMode === 'tana' && !scanning) { $('tana-cam').style.display = 'block'; scanning = true; loop($('tana-video')); }
}

/* ---------- ラベル ---------- */
function drawLabel() {
  if (!D) return;
  const kind = $('l-kind').value, onlyNew = $('l-filter').value === 'new', q = $('q-label').value.trim().toLowerCase();
  const list = (kind === 'mat' ? D.materials.filter(function (m) { return m.kg > 0; }) : D.subs).filter(function (m) { return (!onlyNew || !D.printed[m.id]) && (!q || m.name.toLowerCase().indexOf(q) >= 0); })
    .sort(function (a, b) { return a.name.localeCompare(b.name, 'ja'); });
  $('list-label').innerHTML = '<p class="muted">' + list.length + '件</p>' + list.map(function (m) {
    return '<label class="item lbl-row"><input type="checkbox" class="lchk" value="' + esc(m.id) + '" checked><div style="flex:1"><div class="n">' + esc(m.name) + '</div><div class="s">' + placeText(m) + (D.printed[m.id] ? '　印刷済 ' + esc(D.printed[m.id]) : '') + '</div></div><div class="q">' + num(kind === 'mat' ? m.kg : m.qty) + '</div></label>';
  }).join('');
}
function checkAll(v) { document.querySelectorAll('.lchk').forEach(function (c) { c.checked = v; }); }
function qrSvg(text) {
  const qr = qrcode(0, 'M'); qr.addData(text); qr.make();
  return qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
}
function printLabels() {
  const ids = Array.prototype.map.call(document.querySelectorAll('.lchk:checked'), function (c) { return c.value; });
  if (!ids.length) { toast('印刷するものを選んでください'); return; }
  const labs = ids.map(function (id) {
    const f = find(id); if (!f) return '';
    const it = f.it, mat = f.kind === 'mat';
    return '<div class="lab"><div class="qr">' + qrSvg(qrUrl(id)) + '</div><div class="t"><div class="nm">' + esc(it.name) + '</div>'
      + '<div class="kg">' + (mat ? num(it.kg) + ' kg' : esc(it.cust)) + '</div>'
      + '<div class="sm">' + placeText(it) + (it.note ? '　' + esc(it.note) : '') + '</div>'
      + '<div class="sm">登録 ' + esc(it.date) + '　ID ' + esc(id) + '</div></div></div>';
  });
  let html = '';
  for (let i = 0; i < labs.length; i += 8) html += '<div class="page">' + labs.slice(i, i + 8).join('') + '</div>';
  $('print').innerHTML = html;
  setTimeout(function () {
    window.print();
    setTimeout(function () {
      if (confirm(ids.length + '枚を「印刷済み」にしますか？\n（うまく印刷できなかったときは「キャンセル」）')) call('api_printed', ids).then(load);
    }, 500);
  }, 300);
}

/* ---------- 起動 ---------- */
start();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
