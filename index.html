<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1a2b4c">
<title>材料在庫</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #1a2b4c; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #f2f4f8; }
  #help { position: fixed; left: 0; right: 0; bottom: 0; display: none; padding: 14px 16px; background: #fff;
          font: 16px/1.6 system-ui, sans-serif; color: #1b2430; box-shadow: 0 -2px 8px rgba(0,0,0,.2); }
  #help a { color: #1a2b4c; font-weight: 700; }
  /* カメラ（アプリの上に重ねて出す） */
  #cam { position: fixed; inset: 0; background: #000; display: none; z-index: 10; }
  #cam video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #cam .frame { position: absolute; left: 50%; top: 45%; width: 64vmin; height: 64vmin; transform: translate(-50%, -50%);
                border: 4px solid rgba(255,255,255,.9); border-radius: 16px; box-shadow: 0 0 0 100vmax rgba(0,0,0,.35); }
  #cam .msg { position: absolute; top: 0; left: 0; right: 0; padding: 18px 16px; text-align: center; color: #fff;
              font: bold 19px/1.5 system-ui, sans-serif; background: rgba(0,0,0,.45); }
  #cam button { position: absolute; left: 16px; right: 16px; bottom: calc(24px + env(safe-area-inset-bottom)); padding: 16px;
                font: bold 20px system-ui, sans-serif; border: 0; border-radius: 12px; background: #fff; color: #1a2b4c; }
</style>
</head>
<body>
<!-- 材料在庫アプリ（Google Apps Script）を画面いっぱいに表示する入口。
     Googleのアプリの中ではカメラが使えないため、カメラはこのページで動かし、読んだQRの中身をアプリへ渡す。
     データはここには無く、現場用アカウントでログインしているときだけ表示される -->
<iframe id="app" title="材料在庫" allow="clipboard-write"></iframe>
<div id="help">表示されないときは <a id="direct" target="_blank" rel="noopener">こちらから開いてください</a></div>
<div id="cam"><video id="video" playsinline muted></video><div class="frame"></div>
  <div class="msg" id="cam-msg">QRコードを枠に入れてください</div>
  <button onclick="closeCam(true)">閉じる</button></div>
<script>
  const APP_URL = 'https://script.google.com/macros/s/AKfycbyBnvUjD2chjfheOnqi1PodNZxAXWn_pUZ0e_UPPh7jw4t39sx_NSeN9md8F__GIU5IRg/exec';

  // QR（入口ページのURL?id=…）から開かれたときは、そのIDをアプリへ渡す
  const id = new URLSearchParams(location.search).get('id') || '';
  const src = APP_URL + '?embed=1' + (id ? '&id=' + encodeURIComponent(id) : '');
  const app = document.getElementById('app');
  app.src = src;
  document.getElementById('direct').href = APP_URL + (id ? '?id=' + encodeURIComponent(id) : '');

  // 20秒たっても枠の中の読み込みが終わらないときだけ、直接開くリンクを出す
  let loaded = false;
  app.addEventListener('load', () => { loaded = true; });
  setTimeout(() => { if (!loaded) document.getElementById('help').style.display = 'block'; }, 20000);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

  /* ---------- カメラ ---------- */
  const cam = document.getElementById('cam'), video = document.getElementById('video');
  const canvas = document.createElement('canvas');
  let stream = null, scanning = false, mode = 'open', detector = null, idle = null;

  // アプリ（Googleの枠の何重か内側）へ送る：枠を全部たどって送り、アプリ側で送り主を確かめる
  function toApp(msg) {
    msg.app = 'zaiko';
    (function walk(w) {
      for (let i = 0; i < w.frames.length; i++) {
        try { w.frames[i].postMessage(msg, '*'); walk(w.frames[i]); } catch (e) {}
      }
    })(window);
  }

  window.addEventListener('message', (e) => {
    if (!/\.googleusercontent\.com$/.test(new URL(e.origin).hostname)) return;
    const d = e.data || {};
    if (d.app !== 'zaiko') return;
    if (d.type === 'scan') openCam(d.mode || 'open');
    if (d.type === 'stop') closeCam(false);
  });

  async function openCam(m) {
    mode = m;
    clearTimeout(idle);
    document.getElementById('cam-msg').textContent = m === 'tana' ? '棚卸：QRコードを枠に入れてください' : 'QRコードを枠に入れてください';
    cam.style.display = 'block';
    try {
      if (!stream) {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
        video.srcObject = stream;
      }
      await video.play();
      if (!detector && 'BarcodeDetector' in window) { try { detector = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) {} }
      scanning = true; loop();
    } catch (e) {
      document.getElementById('cam-msg').textContent = 'カメラを使えませんでした。ブラウザの設定でカメラを「許可」にしてください。';
    }
  }

  // byUser：「閉じる」を押したとき（アプリに続けて読むのをやめたと伝える）
  function closeCam(byUser) {
    scanning = false;
    cam.style.display = 'none';
    if (byUser) toApp({ type: 'closed' });
    // すぐ次を読むことが多いので、カメラは30秒だけ止めずに待つ
    clearTimeout(idle);
    idle = setTimeout(() => { if (stream && !scanning) { stream.getTracks().forEach(t => t.stop()); stream = null; } }, 30000);
  }

  function loop() {
    if (!scanning) return;
    const next = () => setTimeout(loop, 200);
    if (!video.videoWidth) { next(); return; }
    if (detector) {
      detector.detect(video).then(r => { r.length ? hit(r[0].rawValue) : next(); }).catch(() => { detector = null; next(); });
      return;
    }
    const w = Math.min(640, video.videoWidth), h = Math.round(video.videoHeight * w / video.videoWidth);
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(video, 0, 0, w, h);
    const code = window.jsQR && jsQR(ctx.getImageData(0, 0, w, h).data, w, h);
    code && code.data ? hit(code.data) : next();
  }

  function hit(text) {
    if (navigator.vibrate) navigator.vibrate(80);
    closeCam(false);
    toApp({ type: 'qr', text: text, mode: mode });
  }
</script>
</body>
</html>
